name: NPCDialogue
version: 1.0
main: com.MinecraftAIPlugin.NPCPlugin
api-version: 1.20
description: A minecraft plugin with LLM for NPC
commands:
  talk:
    description: Talk to NPC
    usage: /talk <message>
  stoptalk:
    description: Stop a conversation with a NPC
    usage: /stoptalk
  startdebug:
    description: Start a debug session with a named NPC.
    usage: /startdebug <npcName>